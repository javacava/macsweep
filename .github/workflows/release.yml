# Builds MyOpenCleaner on GitHub's own Macs and publishes it as a release.
#
# Push a tag such as v1.0.0 to publish a release with a .dmg and a .zip. Run it by hand
# (Actions → Release → Run workflow) to only build and test; the app is then attached to
# the run as an artifact and nothing is published.
#
# Running it by hand with "Add a DMG to an existing release" set to a tag packs the app
# that release already ships into a .dmg and adds it, without rebuilding the app.
#
# The app is signed ad hoc: it carries no developer certificate, name or team ID.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      add_dmg_to:
        description: "Add a DMG to an existing release, e.g. v1.0.0. Leave empty to build and test only."
        required: false
        default: ""

permissions:
  contents: write
  # Signed build provenance: GitHub records which commit and workflow made each file, so anyone
  # can check a download with `gh attestation verify <file> -R javacava/myopencleaner`.
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.add_dmg_to }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || inputs.add_dmg_to == ''
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Test
        timeout-minutes: 15
        run: swift test

      - name: Build universal app (Apple silicon + Intel)
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh

      - name: Check the app
        run: |
          APP=dist/MyOpenCleaner.app
          lipo -archs "$APP/Contents/MacOS/MyOpenCleaner"
          codesign --verify --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Signature=adhoc"
          "$APP/Contents/MacOS/MyOpenCleaner" --help > /dev/null

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="MyOpenCleaner-${VERSION}.zip"
          DMG="MyOpenCleaner-${VERSION}.dmg"
          ditto -c -k --sequesterRsrc --keepParent dist/MyOpenCleaner.app "$ZIP"
          scripts/make_dmg.sh dist/MyOpenCleaner.app "$DMG"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          cat "$ZIP.sha256" "$DMG.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.zip }}

      - uses: actions/upload-artifact@v4
        with:
          name: MyOpenCleaner-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.dmg }}.sha256
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
          DMG: ${{ steps.package.outputs.dmg }}
        run: |
          scripts/release_notes.sh "$GITHUB_REF_NAME" "$DMG" "$ZIP" > notes.md
          gh release create "$GITHUB_REF_NAME" "$DMG" "$DMG.sha256" "$ZIP" "$ZIP.sha256" \
            --title "MyOpenCleaner ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag

  add-dmg:
    if: github.event_name == 'workflow_dispatch' && inputs.add_dmg_to != ''
    runs-on: macos-26
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.add_dmg_to }}
    steps:
      - uses: actions/checkout@v5

      - name: Download the release's app
        id: download
        run: |
          V="${TAG#v}"
          ZIP="MyOpenCleaner-${V}.zip"
          mkdir -p release
          gh release download "$TAG" --pattern "$ZIP" --pattern "$ZIP.sha256" --dir release
          (cd release && shasum -a 256 -c "$ZIP.sha256")
          ditto -x -k "release/$ZIP" unpacked
          APP=unpacked/MyOpenCleaner.app
          codesign --verify --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "zip=release/$ZIP" >> "$GITHUB_OUTPUT"

      - name: Make the DMG
        id: package
        env:
          VERSION: ${{ steps.download.outputs.version }}
        run: |
          DMG="MyOpenCleaner-${VERSION}.dmg"
          scripts/make_dmg.sh unpacked/MyOpenCleaner.app "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          cat "$DMG.sha256"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"

      # Only the DMG: it is made in this run. The zip was built by the tag's own run.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.package.outputs.dmg }}

      - name: Add it to the release
        env:
          DMG: ${{ steps.package.outputs.dmg }}
          ZIP: ${{ steps.download.outputs.zip }}
        run: |
          gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          scripts/release_notes.sh "$TAG" "$DMG" "$ZIP" > notes.md
          gh release edit "$TAG" --notes-file notes.md
