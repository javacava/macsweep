# Builds MyOpenCleaner on GitHub's own Macs and publishes it as a release.
#
# Push a tag such as v1.0.0 to publish a release. Run it by hand
# (Actions → Release → Run workflow) to only build and test; the app is then
# attached to the run as an artifact and nothing is published.
#
# The app is signed ad hoc: it carries no developer certificate, name or team ID.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Test
        timeout-minutes: 15
        run: swift test

      - name: Build universal app (Apple silicon + Intel)
        env:
          UNIVERSAL: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: ./build.sh

      - name: Check the app
        run: |
          APP=dist/MyOpenCleaner.app
          lipo -archs "$APP/Contents/MacOS/MyOpenCleaner"
          codesign --verify --strict "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Signature=adhoc"
          "$APP/Contents/MacOS/MyOpenCleaner" --help > /dev/null

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="MyOpenCleaner-${VERSION}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/MyOpenCleaner.app "$ZIP"
          shasum -a 256 "$ZIP" > "$ZIP.sha256"
          cat "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: MyOpenCleaner-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          SHA="$(cut -d' ' -f1 "$ZIP.sha256")"
          cat > notes.md <<EOF
          ## Download

          **[$ZIP](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$ZIP)** — one app for Apple silicon and Intel Macs, macOS 14 Sonoma or later.

          1. Unzip it and drag **MyOpenCleaner** to **Applications**.
          2. Open it. macOS will say it cannot check the app for malicious software, because the app is not notarized by Apple.
          3. Open **System Settings → Privacy & Security**, scroll down and click **Open Anyway** next to MyOpenCleaner. You only do this once.

          Prefer Terminal? \`xattr -dr com.apple.quarantine /Applications/MyOpenCleaner.app\` does the same.

          The app was built from this tag's source by GitHub Actions and is signed ad hoc. You can always build it yourself instead: \`./build.sh --install\`.

          SHA-256: \`$SHA\`
          EOF
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "MyOpenCleaner ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
